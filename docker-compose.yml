services:
  execution:
    container_name: ronin-reth
    build:
      context: .
      dockerfile: Dockerfile.reth
    environment:
      - DATADIR=/data
      - NETWORK=${NETWORK}
    ports:
      - "${RETH_HTTP_PORT:-8545}:8545"
      - "${RETH_WS_PORT:-8546}:8546"
      - "${RETH_AUTHRPC_PORT:-9551}:9551"
    command:
      - "--rollup.sequencer=${RETH_SEQUENCER_URL}"
      - "--http"
      - "--http.addr=0.0.0.0"
      - "--http.port=8545"
      - "--http.api=admin,debug,eth,net,trace,txpool,web3"
      - "--ws"
      - "--ws.addr=0.0.0.0"
      - "--ws.port=8546"
      - "--ws.origins=*"
      - "--authrpc.addr=0.0.0.0"
      - "--authrpc.port=9551"
      - "--authrpc.jwtsecret=/jwt/jwt.hex"
    volumes:
      - ${DATADIR:-./datadir}:/data
      - ${DATADIR:-./datadir}/jwt.hex:/jwt/jwt.hex

  op-node:
    container_name: ronin-op-node
    build:
      context: .
      dockerfile: Dockerfile.op-node
    depends_on:
      - execution
    environment:
      - NETWORK=${NETWORK}
      - OP_NODE_P2P_STATIC=${OP_NODE_P2P_STATIC}
    ports:
      - "${OP_NODE_RPC_PORT:-7000}:7000"
      - "${OP_NODE_P2P_PORT:-9222}:9222"
      - "${OP_NODE_P2P_PORT:-9222}:9222/udp"
    command:
      - "--l1=${OP_NODE_L1_ETH_RPC}"
      - "--l2=http://execution:9551"
      - "--l2.jwt-secret=/jwt/jwt.hex"
      - "--rpc.addr=0.0.0.0"
      - "--rpc.port=7000"
      - "--l1.beacon=${OP_NODE_L1_BEACON}"
      - "--p2p.listen.ip=0.0.0.0"
      - "--p2p.listen.tcp=9222"
      - "--p2p.listen.udp=9222"
      - "--p2p.static=${OP_NODE_P2P_STATIC}"
      - "--rpc.enable-admin"
      - "--metrics.enabled"
      - "--metrics.addr=0.0.0.0"
      - "--metrics.port=7300"
    volumes:
      - ${DATADIR:-./datadir}/jwt.hex:/jwt/jwt.hex
